#
# CI for the standalone OmniSeek repository. Paths are relative to the repository root.
# Builds a wheel on tags but publishes nothing.
name: ci
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q omniseek tests
      - run: python -m unittest discover -s tests -v
      - name: Self-scan and verify every citation
        run: |
          python -m omniseek scan . --output "$RUNNER_TEMP/self.json" --html "$RUNNER_TEMP/self.html" --sarif "$RUNNER_TEMP/self.sarif"
          python -m omniseek verify "$RUNNER_TEMP/self.json" --repo .
      - run: bash examples/run_demo.sh "$RUNNER_TEMP/demo"
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build
      - run: python -m build
      - name: Install the wheel in a clean environment and smoke-test the entry points
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/venv/bin/omniseek" --version
          "$RUNNER_TEMP/venv/bin/omniseek-mcp" --version
          "$RUNNER_TEMP/venv/bin/omniseek" scan examples/vulnerable_app --quiet --output "$RUNNER_TEMP/demo.json"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: omniseek-dist
          path: dist/
  mcp-http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[mcp]"
      - name: Streamable HTTP transport answers tools/list
        run: |
          omniseek-mcp --transport streamable-http --root . --port 8765 &
          sleep 5
          python - <<'PY'
          import asyncio
          from mcp import ClientSession
          import mcp.client.streamable_http as transport

          connect = getattr(transport, "streamable_http_client", None) or transport.streamablehttp_client

          async def main():
              async with connect("http://127.0.0.1:8765/mcp") as streams:
                  async with ClientSession(streams[0], streams[1]) as session:
                      await session.initialize()
                      names = sorted(t.name for t in (await session.list_tools()).tools)
                      assert names == ["omniseek_render_dossier", "omniseek_scan", "omniseek_verify_citations"], names
                      print("tools:", names)

          asyncio.run(main())
          PY
